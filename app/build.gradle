apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

def keystorePath = System.getenv("KEYSTORE_FILE")

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.3"
    ndkVersion "21.4.7075529"

    defaultConfig {
        applicationId "com.fluxin.apktoolmd"
        minSdkVersion 26
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        stable {
            // Provided by CI from repository secrets. When absent (e.g. a local
            // build without the keystore) the default debug signing is used.
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (keystorePath != null) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePath != null) {
                signingConfig signingConfigs.stable
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.3.72"
    implementation 'androidx.core:core-ktx:1.3.2'

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    // In-app APK re-signing of the patched game (APK Signature Scheme v1/v2).
    implementation 'com.android.tools.build:apksig:4.2.2'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
